name: 唔姆签到

on:
  schedule:
    # 每天 00:30 UTC = 北京时间 08:30（可自行调整）
    - cron: '30 0 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main
      - master

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sign
        env:
          WUMU_TOKEN: ${{ secrets.WUMU_TOKEN }}
          WUMU_DOUBLE: ${{ secrets.WUMU_DOUBLE }}
        run: |
          if [ -z "$WUMU_TOKEN" ]; then
            echo "未配置 WUMU_TOKEN secret，跳过签到。"
            echo "如需启用自动签到，请在仓库 Settings → Secrets and variables → Actions 中添加 WUMU_TOKEN。"
            exit 0
          fi
          python3 wumu_sign.py